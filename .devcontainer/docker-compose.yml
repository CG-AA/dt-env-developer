services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match container user UID/GID to host user for proper file permissions
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist vscode user home directory
      - vscode-home:/home/vscode
      # Mount the workspace
      - ../..:/workspaces:cached
      - /tmp # Anonymous volume
    user: vscode
    command: sleep infinity
    init: true
    network_mode: host
    environment:
      - DOCKER_BUILDKIT=1

volumes:
  # Named volume to persist vscode home directory
  vscode-home:
    driver: local
